<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Todos</title>
  </head>
  <body>
    <script src="/build/main.js"></script>
    <script src="/node_modules/convex/dist/browser.bundle.js"></script>
    <script>
      // The deployment URL is a public endpoint, not a secret.
      const CONVEX_URL = "https://exciting-bee-498.convex.cloud";
      const client = new convex.ConvexClient(CONVEX_URL);

      const app = Elm.Main.init();

      // Outgoing port (Elm → Convex): run the create mutation.
      app.ports.createTodo.subscribe((draft) => {
        client.mutation("todos:create", draft).catch(console.error);
      });

      // Outgoing port (Elm → Convex): { todoId, isCompleted } matches the
      // markCompleted mutation's args, so it's passed straight through.
      app.ports.markCompleted.subscribe((args) => {
        client.mutation("todos:markCompleted", args).catch(console.error);
      });

      // Incoming port (Convex → Elm): fires on load and again whenever the
      // todos table changes, in this tab or any other client.
      client.onUpdate("todos:list", {}, (todos) => {
        app.ports.todosUpdated.send(todos);
      });
    </script>
  </body>
</html>
